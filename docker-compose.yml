
services:
  # [1] PostgreSQL 데이터베이스 서비스
  db:
    image: postgres:15
    container_name: student-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      # 초기 SQL 스크립트 실행 (컨테이너 최초 실행 시 테이블 자동 생성)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      # 데이터 영속성 유지
      - postgres_data:/var/lib/postgresql/data
    networks:
      - student-network

  # [2] Spring Legacy 웹 애플리케이션 서비스
  app:
    build: .
    container_name: student-app
    # DB가 먼저 준비된 후 앱 실행
    depends_on:
      - db
    ports:
      - "8282:8080"
    networks:
      - student-network

networks:
  student-network:
    driver: bridge

volumes:
  postgres_data:
